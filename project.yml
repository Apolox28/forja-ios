name: Forja
options:
  bundleIdPrefix: com.forja
  developmentLanguage: es
  deploymentTarget:
    iOS: "15.0"
targets:
  Forja:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Forja
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations:
          - es
          - en
          - pt
          - fr
          - it
          - de
        CFBundleShortVersionString: "1.5.1"
        CFBundleVersion: "36"
        UILaunchStoryboardName: LaunchScreen
        NSCameraUsageDescription: Forja usa la cámara para grabar tu técnica y que el Coach la revise.
        NSMicrophoneUsageDescription: Al grabar vídeo, iOS también usa el micrófono; Forja no envía el audio.
        NSPhotoLibraryUsageDescription: Forja accede a tus vídeos solo cuando eliges uno para revisar la técnica.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: CSV
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.comma-separated-values-text
              - public.plain-text
          - CFBundleTypeName: JSON
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forja.app
        MARKETING_VERSION: "1.5"
        CURRENT_PROJECT_VERSION: "32"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Perrito AppIcon-Naranja AppIcon-Rojo AppIcon-Azul AppIcon-Verde AppIcon-Morado AppIcon-Rosa AppIcon-Dorado AppIcon-Claro AppIcon-Degradado"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
