name: Compilar IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen ldid

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar (sin firmar)
        run: |
          xcodebuild build \
            -project Forja.xcodeproj \
            -target Forja \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Forja.app Payload/
          ldid -SForja.entitlements Payload/Forja.app/Forja
          zip -qry Forja.ipa Payload

      - name: Subir .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Forja-ipa
          path: Forja.ipa
          if-no-files-found: error
